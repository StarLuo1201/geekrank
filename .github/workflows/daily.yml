name: daily-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write          # 允许机器人把更新后的 data.json 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python update.py
        env:
          PRICE_API: ${{ secrets.PRICE_API }}
          PRICE_KEY: ${{ secrets.PRICE_KEY }}
          PRICE_AUTH: ${{ secrets.PRICE_AUTH }}

      - run: |
          git config user.name "geekrank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "daily update" && git push)
